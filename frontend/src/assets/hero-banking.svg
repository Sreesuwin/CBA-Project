<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Banking and credit assessment illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f2f6b"/>
    </linearGradient>
  </defs>
  <circle cx="260" cy="210" r="185" fill="url(#sky)"/>

  <!-- bank building -->
  <path d="M120 168 260 96l140 72z" fill="#fbbf24"/>
  <rect x="128" y="170" width="264" height="14" rx="3" fill="#0f2f6b"/>
  <g fill="#1d4ed8">
    <rect x="150" y="190" width="30" height="96" rx="4"/>
    <rect x="196" y="190" width="30" height="96" rx="4"/>
    <rect x="242" y="190" width="30" height="96" rx="4"/>
    <rect x="288" y="190" width="30" height="96" rx="4"/>
    <rect x="334" y="190" width="30" height="96" rx="4"/>
  </g>
  <rect x="128" y="290" width="264" height="16" rx="4" fill="#0f2f6b"/>

  <!-- growth chart -->
  <g>
    <rect x="150" y="352" width="200" height="8" rx="4" fill="#c7d2fe"/>
    <polyline points="158,344 210,318 258,330 316,286 356,262" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="356" cy="262" r="9" fill="#16a34a"/>
    <circle cx="158" cy="344" r="7" fill="#22c55e"/>
  </g>

  <!-- floating coins -->
  <g>
    <circle cx="92" cy="120" r="24" fill="#fbbf24"/>
    <text x="92" y="128" font-family="Segoe UI, Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#7c2d12">&#8377;</text>
  </g>
  <g>
    <circle cx="430" cy="128" r="20" fill="#f59e0b"/>
    <text x="430" y="135" font-family="Segoe UI, Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#7c2d12">&#8377;</text>
  </g>

  <!-- shield / approval badge -->
  <g transform="translate(388 300)">
    <path d="M28 0 56 12v26c0 20-12 34-28 42C12 72 0 58 0 38V12z" fill="url(#navy)"/>
    <path d="M17 36l9 10 19-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
